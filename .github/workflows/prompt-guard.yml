name: Prompt Guard

on:
  pull_request:
    paths:
      - '.prompts/**'
      - 'fixtures/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  prompt-guard:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      
      - name: Install dependencies
        run: uv sync
      
      - name: Run Prompt Guard
        id: guard
        run: |
          uv run python -m promptgit.ci_guard \
            --dataset fixtures/dataset.jsonl \
            --threshold 0.05 \
            --report prompt_diff_report.md \
            || echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Comment PR with Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read report
            let report = '';
            try {
              report = fs.readFileSync('prompt_diff_report.md', 'utf8');
            } catch (e) {
              report = '⚠️ Could not generate report';
            }
            
            // Get run status
            const exitCode = '${{ steps.guard.outcome }}' === 'failure' ? 1 : 0;
            const statusIcon = exitCode === 0 ? '✅' : '❌';
            
            // Create comment
            const body = `## ${statusIcon} Prompt Guard Results
            
            ${report}
            
            ---
            <details>
            <summary>Workflow Details</summary>
            
            - **Run ID:** ${context.runId}
            - **Commit:** ${context.sha.substring(0, 8)}
            - **Branch:** ${context.ref}
            </details>`;
            
            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existingComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('Prompt Guard Results')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
      
      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-diff-report
          path: prompt_diff_report.md
      
      - name: Fail if guard failed
        if: steps.guard.outcome == 'failure'
        run: exit 1
