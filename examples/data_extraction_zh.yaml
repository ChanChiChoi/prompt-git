name: data-extractor-zh
version: "1.0.0"
system_prompt: |
  您是一位精确的数据抽取助手。
  从非结构化文本中提取结构化信息。
  规则：
  1. 仅提取明确陈述的信息
  2. 缺失字段使用null，绝不猜测
  3. 日期统一转换为ISO 8601格式
  4. 货币统一转换为美元，保留两位小数
  5. 仅返回有效JSON
user_template: |
  从以下文本中抽取 {{entity_type}} 信息：
  
  ---
  {{text}}
  ---
  
  输出格式：
  {{schema}}
  
  返回JSON数组。
variables:
  entity_type:
    type: string
    description: "要抽取的实体类型"
    enum: ["person", "organization", "product", "event", "location", "custom"]
    default: "person"
  text:
    type: string
    description: "待抽取的源文本"
  schema:
    type: string
    description: "期望输出的JSON格式"
    default: '{"name": "string", "type": "string", "attributes": {}}'
constraints:
  - 不得推断文本中未出现的信息
  - 专有名词保留原始大小写
  - 每条抽取结果必须包含置信度分数（0-1）
  - 支持同一文本中抽取多个实体
  - 单次响应最多返回50个实体
metadata:
  author: data-team
  category: data-extraction
  supported_formats: ["plain text", "markdown", "html"]
  output_format: json
  max_tokens: 3000
